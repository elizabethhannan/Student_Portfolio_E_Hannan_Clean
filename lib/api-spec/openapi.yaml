openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cv-dossier
    description: Session-only questions grounded in the public CV dossier
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cv-dossier/ask:
    post:
      operationId: askCvDossier
      tags: [cv-dossier]
      summary: Answer a question using the CV dossier
      description: Returns an evidence-grounded answer without storing the conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvDossierAskInput"
      responses:
        "200":
          description: Answer generated from the CV dossier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvDossierAnswer"
        "400":
          description: Invalid question or conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Question limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The CV assistant is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CvDossierTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1500
      required:
        - role
        - content
    CvDossierAskInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/CvDossierTurn"
      required:
        - messages
    CvDossierAnswer:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 5000
        sources:
          type: array
          items:
            type: string
            maxLength: 80
      required:
        - answer
        - sources
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

